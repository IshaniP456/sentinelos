AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SentinelOS data stack (owner: Mariam). DynamoDB tables for warehouse, agents,
  and audit, plus the five data Lambdas invoked by Ishani's API stack. Deploy
  in us-east-1. Tables are retained if the stack is deleted.

Parameters:
  StateMachineArn:
    Type: String
    Default: ''
    Description: >
      Tishneet's planning state machine ARN. Reset checks it for RUNNING
      executions. Leave empty until it exists; reset then refuses (fail closed).
  ApiFunctionRoleArn:
    Type: String
    Default: ''
    Description: >
      IAM role ARN of Ishani's API Lambda. If set, it is allowed to read the
      admin-assertion signing secret so the API can sign revoke/reset requests.
  AgentId:
    Type: String
    Default: inventory-agent-01
  WarehouseId:
    Type: String
    Default: demo-warehouse

Conditions:
  HasStateMachine: !Not [!Equals [!Ref StateMachineArn, '']]
  HasApiRole: !Not [!Equals [!Ref ApiFunctionRoleArn, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        SENTINEL_WAREHOUSE_TABLE: !Ref WarehouseTable
        SENTINEL_AGENTS_TABLE: !Ref AgentsTable
        SENTINEL_AUDIT_TABLE: !Ref AuditTable
        SENTINEL_AGENT_ID: !Ref AgentId
        SENTINEL_WAREHOUSE_ID: !Ref WarehouseId

Resources:
  # ------------------------------------------------------------------ tables
  WarehouseTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: sentinel_warehouse
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: warehouse_id, AttributeType: S}
      KeySchema:
        - {AttributeName: warehouse_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AgentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: sentinel_agents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: agent_id, AttributeType: S}
      KeySchema:
        - {AttributeName: agent_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: sentinel_audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: plan_id, AttributeType: S}
        - {AttributeName: event_id, AttributeType: S}
        - {AttributeName: feed, AttributeType: S}
      KeySchema:
        - {AttributeName: plan_id, KeyType: HASH}
        - {AttributeName: event_id, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: recent_events
          KeySchema:
            - {AttributeName: feed, KeyType: HASH}
            - {AttributeName: event_id, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # ------------------------------------------------- admin assertion secret
  AdminAssertionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: sentinel/admin-assertion-key
      Description: HMAC key for signed admin assertions (revoke/reset). Generated by AWS; never in code.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  AdminAssertionSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: HasApiRole
    Properties:
      SecretId: !Ref AdminAssertionSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref ApiFunctionRoleArn}
            Action: secretsmanager:GetSecretValue
            Resource: '*'

  # ---------------------------------------------------------------- lambdas
  WarehouseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sentinel-data-warehouse
      Handler: data.lambdas.warehouse_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt WarehouseTable.Arn

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sentinel-data-agent
      Handler: data.lambdas.agent_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AgentsTable.Arn

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sentinel-data-audit
      Handler: data.lambdas.audit_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt AuditTable.Arn
                - !Sub '${AuditTable.Arn}/index/recent_events'

  RevokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sentinel-data-revoke
      Handler: data.lambdas.revoke_handler
      Environment:
        Variables:
          ADMIN_SECRET_ARN: !Ref AdminAssertionSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AgentsTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AdminAssertionSecret

  ResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sentinel-data-reset
      Handler: data.lambdas.reset_handler
      Environment:
        Variables:
          ADMIN_SECRET_ARN: !Ref AdminAssertionSecret
          STATE_MACHINE_ARN: !Ref StateMachineArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                - !GetAtt WarehouseTable.Arn
                - !GetAtt AgentsTable.Arn
                - !GetAtt AuditTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AdminAssertionSecret
            - !If
              - HasStateMachine
              - Effect: Allow
                Action: states:ListExecutions
                Resource: !Ref StateMachineArn
              - !Ref AWS::NoValue

Outputs:
  WarehouseFnArn:
    Description: Ishani's WarehouseFn parameter
    Value: !GetAtt WarehouseFunction.Arn
  AgentFnArn:
    Description: Ishani's AgentFn parameter
    Value: !GetAtt AgentFunction.Arn
  AuditFnArn:
    Description: Ishani's AuditFn parameter
    Value: !GetAtt AuditFunction.Arn
  RevokeFnArn:
    Description: Ishani's RevokeFn parameter
    Value: !GetAtt RevokeFunction.Arn
  ResetFnArn:
    Description: Ishani's ResetFn parameter
    Value: !GetAtt ResetFunction.Arn
  WarehouseTableName:
    Value: !Ref WarehouseTable
  AgentsTableName:
    Value: !Ref AgentsTable
  AuditTableName:
    Value: !Ref AuditTable
  AdminAssertionSecretArn:
    Description: Ishani's API reads this key to sign revoke/reset requests
    Value: !Ref AdminAssertionSecret
